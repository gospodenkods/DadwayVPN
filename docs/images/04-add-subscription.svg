<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Добавление HTTPS-подписки Dadway VPN</title>
  <desc id="desc">Поле ссылки и кнопка Добавить.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081118"/><stop offset="1" stop-color="#14232c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".5"/></filter></defs>
  <rect width="720" height="980" rx="50" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <rect x="58" y="170" width="604" height="474" rx="40" fill="#17262f" stroke="#42535d" stroke-width="2" filter="url(#s)"/>
    <text x="102" y="242" font-size="36" font-weight="700" fill="#f6f8f9">Новая подписка</text>
    <text x="102" y="295" font-size="19" fill="#aab6bc">Вставьте полную ссылку поставщика</text>
    <rect x="94" y="332" width="532" height="92" rx="24" fill="#0e1921" stroke="#ffc400" stroke-width="3"/>
    <text x="120" y="369" font-size="18" fill="#8c9aa2">HTTPS-ссылка подписки</text>
    <text x="120" y="403" font-size="19" fill="#f5f7f8">https://example.com/sub/…#…</text>
    <text x="120" y="459" font-size="17" fill="#8fa0a8">Ссылка должна начинаться с https://</text>
    <line x1="94" y1="500" x2="626" y2="500" stroke="#31434d" stroke-width="2"/>
    <rect x="356" y="527" width="158" height="66" rx="24" fill="#ffc400"/>
    <text x="435" y="568" text-anchor="middle" font-size="21" font-weight="700" fill="#111a20">ДОБАВИТЬ</text>
    <text x="565" y="568" text-anchor="middle" font-size="19" fill="#b8c2c8">ОТМЕНА</text>
    <path d="M435 824 C435 760 435 685 435 606" fill="none" stroke="#ffc400" stroke-width="10" stroke-linecap="round"/>
    <path d="M414 628 L435 599 L456 628" fill="none" stroke="#ffc400" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="875" text-anchor="middle" font-size="24" font-weight="700" fill="#ffc400">4. Вставьте ссылку и нажмите «Добавить»</text>
    <text x="360" y="914" text-anchor="middle" font-size="19" fill="#aab6bc">После загрузки выберите сервер и подключитесь</text>
  </g>
</svg>
