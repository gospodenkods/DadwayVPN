    <rect x="48" y="696" width="624" height="150" rx="38" fill="#14212a" stroke="#d8ab0a" stroke-width="4"/>
    <circle cx="106" cy="752" r="28" fill="#1d2c35"/><text x="106" y="763" text-anchor="middle" font-size="32">＋</text>
    <text x="160" y="747" font-size="29" font-weight="700" fill="#f5f7f8">Добавьте подписку</text>
    <text x="160" y="783" font-size="18" fill="#a8b2b8">Настройки → Управление подписками</text>
    <text x="160" y="817" font-size="18" fill="#e8b60a">Список подписок пуст</text>

    <rect x="48" y="960" width="624" height="106" rx="36" fill="#13212a" stroke="#34454f" stroke-width="2"/>
