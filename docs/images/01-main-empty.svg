<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Главный экран Dadway VPN с пустым списком подписок</title>
  <desc id="desc">Стрелка указывает на кнопку Настройки.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071017"/><stop offset="1" stop-color="#101a22"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb900"/><stop offset=".55" stop-color="#ff5b20"/><stop offset="1" stop-color="#ef3340"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="720" height="1280" rx="54" fill="url(#bg)"/>
  <rect x="20" y="20" width="680" height="1240" rx="42" fill="none" stroke="#293944" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
