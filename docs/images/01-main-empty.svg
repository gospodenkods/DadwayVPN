    <text x="360" y="518" text-anchor="middle" font-size="27" font-weight="700" fill="#ef4d51">Защита выключена</text>

    <text x="48" y="580" font-size="27" font-weight="700" fill="#f5f7f8">Выбранный сервер</text>
    <rect x="48" y="608" width="624" height="64" rx="26" fill="#111d25" stroke="#42515a" stroke-width="2"/>
