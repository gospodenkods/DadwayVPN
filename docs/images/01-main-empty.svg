    <text x="140" y="116" font-size="17" fill="#9aa7af">Версия 8.5.6</text>
    <text x="140" y="145" font-size="18" font-weight="700" fill="#d0a800">Помощь проекту</text>
    <text x="590" y="108" text-anchor="middle" font-size="18" fill="#9aa7af">dadway.ru</text>

    <circle cx="360" cy="335" r="151" fill="#0e1921" stroke="url(#ring)" stroke-width="14" filter="url(#shadow)"/>
    <circle cx="360" cy="335" r="126" fill="#13222c" stroke="#31434e" stroke-width="2"/>
    <path d="M302 270 Q360 232 418 270 L412 361 Q363 414 302 361Z" fill="#0a141b" stroke="#ffc400" stroke-width="8"/>
