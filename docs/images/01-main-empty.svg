      <text x="126" y="1010" font-size="28" fill="#d9ad0c">✓</text><text x="126" y="1042">ГЛАВНАЯ</text>
      <text x="282" y="1010" font-size="28">⌁</text><text x="282" y="1042">СТАТИСТИКА</text>
