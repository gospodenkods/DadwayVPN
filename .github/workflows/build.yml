name: Build Dadway VPN Production APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: false
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build VPN core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v26.7.28 https://github.com/XTLS/libXray.git .ci-libxray
          cd .ci-libxray
          python3 build/main.py android 2>&1 | tee ../libxray-build.log
          test -f libXray.aar
          mkdir -p ../app/libs
          cp libXray.aar ../app/libs/libXray.aar
          unzip -p ../app/libs/libXray.aar classes.jar > "$RUNNER_TEMP/libxray-classes.jar"
          javap -classpath "$RUNNER_TEMP/libxray-classes.jar" libXray.LibXray | tee ../libxray-api.txt
          grep -q 'setDNS(libXray.DialerController, java.lang.String)' ../libxray-api.txt
          grep -q 'resetDNS()' ../libxray-api.txt
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Restore release signing key
        shell: bash
        env:
          DADWAY_KEYSTORE_BASE64: ${{ secrets.DADWAY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DADWAY_KEYSTORE_BASE64"
          printf '%s' "$DADWAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dadway-release.jks"
      - name: Build signed release AAB
        shell: bash
        env:
          DADWAY_KEYSTORE_PATH: ${{ runner.temp }}/dadway-release.jks
          DADWAY_KEYSTORE_PASSWORD: ${{ secrets.DADWAY_KEYSTORE_PASSWORD }}
          DADWAY_KEY_ALIAS: ${{ secrets.DADWAY_KEY_ALIAS }}
          DADWAY_KEY_PASSWORD: ${{ secrets.DADWAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean testReleaseUnitTest bundleRelease --stacktrace 2>&1 | tee aab-build.log
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p output/aab
          cp app/build/outputs/bundle/release/app-release.aab output/aab/DadwayVPN-8.5.7.aab
          (cd output/aab && sha256sum *.aab > SHA256SUMS.txt)
      - name: Validate signed Android App Bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s output/aab/DadwayVPN-8.5.7.aab
          jarsigner -verify output/aab/DadwayVPN-8.5.7.aab | tee aab-signature.txt
          grep -q 'jar verified' aab-signature.txt
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate \
            --bundle=output/aab/DadwayVPN-8.5.7.aab | tee aab-validation.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle=output/aab/DadwayVPN-8.5.7.aab \
            --module=base | tee aab-manifest.xml
          grep -q 'package="ru.dadway.dadwayvpn"' aab-manifest.xml
          grep -q 'android:versionCode="857"' aab-manifest.xml
          grep -q 'android:versionName="8.5.7"' aab-manifest.xml
          grep -q 'android:targetSdkVersion="36"' aab-manifest.xml
          unzip -l output/aab/DadwayVPN-8.5.7.aab | tee aab-contents.txt
          grep -q 'base/manifest/AndroidManifest.xml' aab-contents.txt
          grep -q 'base/lib/arm64-v8a/' aab-contents.txt
          grep -q 'base/lib/armeabi-v7a/' aab-contents.txt
      - name: Upload Google Play AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DadwayVPN-8.5.7-google-play-aab
          path: output/aab/
          retention-days: 30
      - name: Build signed ABI APKs
        if: success()
        shell: bash
        env:
          DADWAY_KEYSTORE_PATH: ${{ runner.temp }}/dadway-release.jks
          DADWAY_KEYSTORE_PASSWORD: ${{ secrets.DADWAY_KEYSTORE_PASSWORD }}
          DADWAY_KEY_ALIAS: ${{ secrets.DADWAY_KEY_ALIAS }}
          DADWAY_KEY_PASSWORD: ${{ secrets.DADWAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease -PdadwayAbiApks=true --stacktrace 2>&1 | tee apk-build.log
          mkdir -p output/apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk output/apk/DadwayVPN-v8.5.7-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk output/apk/DadwayVPN-v8.5.7-armeabi-v7a.apk
          (cd output/apk && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DadwayVPN-v8.5.7-production-apk
          path: output/apk/
          retention-days: 30
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DadwayVPN-v8.5.7-production-build-logs
          path: |
            aab-build.log
            apk-build.log
            libxray-build.log
            libxray-api.txt
            aab-signature.txt
            aab-validation.txt
            aab-manifest.xml
            aab-contents.txt
          if-no-files-found: warn
          retention-days: 14
